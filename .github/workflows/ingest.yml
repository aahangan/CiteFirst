name: OSHA ingest

# Refreshes the OSHA case snapshot in Redis each morning, before the 11:00 UTC delivery cron.
on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ingest
        run: npm run ingest
        env:
          DOL_API_KEY: ${{ secrets.DOL_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
